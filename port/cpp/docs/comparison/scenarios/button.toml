# Scenario for the `button` page: capture idle, tap the counter button, capture the reacted state.
#
# COORDINATE SPACE — fractions of the captured surface (0..1 both axes), the house convention. This
# file was the LAST absolute-coordinate scenario in the directory, and being absolute cost it three
# different ways, all observed rather than theorised:
#
#   * maccatalyst pins its window at [128,30 1024x800], so the old `at = [756, 171]` resolved to image
#     (628,141) — not the "Clicked" button, which that lane's capture puts at (511,127). The cell scored
#     INVALID/`not-driven`: injected, no reaction, no information.
#   * the appkit lane REFUSED the file outright — "SCENARIO SKIPPED macos/appkit/button: absolute screen
#     coordinates, but this lane never PINS its window (present=false) … re-author as 0..1 fractions".
#   * recapture's coordinate_space() classifies a file with ANY absolute pair as absolute and drops it
#     from the DEVICE lanes BY NAME, so iOS and Android had never driven this page at all.
#
# MEASURED per lane — the "Clicked" button (3rd), centre / frame size:
#
#   ios          text band y[542..574] x[533..670]   centre (601,558) of 1206x2622  -> 0.4983, 0.2128
#   android      button plate y[471..570]            centre (539,520) of 1080x2340  -> 0.4991, 0.2222
#   maccatalyst  text band y[123..131] x[493..530]   centre (511,127) of 1024x800   -> 0.4990, 0.1588
#   windows      button plate y[146..175]            centre (511,160) of 1024x800   -> 0.4990, 0.2000
#
# Android and Windows were measured by their button PLATE fill rather than their text, because both
# render the page as one unbroken content band that a background-delta row scan cannot separate.
#
# THE PORTABLE VALUE MUST BE THE iOS ONE, and that is forced rather than conventional: only the VM lanes
# have env names, so `at_<env>` can address maccatalyst and windows only — iOS and Android must share
# the portable `at`. 0.2128 resolves to y=498 on Android, inside its plate [471..570]. The reverse does
# not hold: Android's 0.2222 is y=583 on iOS, just past the "Clicked" band that ends at 574.
#
# `automation_id` stays as the forward-looking hook: the DevFlow driver taps by name (no coordinates);
# the coordinate driver ignores it and uses `at`.

# THE TWIN NOW REACTS, AND THIS FILE'S EXEMPTION IS RETIRED. It used to carry
# `twin_cannot_react = true`, because pages/button.xaml declared `<Button Text="Clicked"/>` beside
# `<!-- Clicked (handler omitted) -->` while the code-first builder DID wire it — so driving this page
# could only ever produce a MOTION MISMATCH that blamed the port for the twin's omission. That flag's
# own comment said "RETIRE THIS BY FIXING THE TWIN, not by deleting the scenario". The twin is fixed
# (x:Name anchors + hand-written partials on both sides), so all three columns now go "Taps: 0" ->
# "Taps: 1" on the same click and the scorer needs no exemption here.

tag = "button"
themes = ["light"]        # add "dark" to also sweep dark; frames continue the NNNN sequence
timeout_seconds = 30

[[steps]]
name = "initial"          # no action -> settle + screenshot

[[steps]]
name = "after-tap"
action = "click"
at = [0.4983, 0.2128]     # the "Clicked" button (3rd) -> bumps the "Taps:" readout 0 -> 1
at_macos-arm64 = [0.499, 0.1588]
at_windows-x64 = [0.499, 0.2000]
# THE DECLARED REACTION REGION — where the "Taps:" readout lives, per lane. A tap that does not change
# THIS box did not do what this scenario claims, however much else moved on the page.
#
# WHY IT IS NEEDED HERE SPECIFICALLY: run 2026-08-09-18_48_05 scored this cell GREEN/PASS while MAUI's
# readout still read "Taps: 0" and both port columns read "Taps: 1". Both columns had moved (so no
# mismatch) and the frames agreed to 0.40% differing at SSIM 0.9897 — because the entire difference was
# one digit, ~41 px of 819,200, about 0.005% of the frame. No threshold catches that; only a location
# does.
#
# WHY PER-LANE, measured — the readout and the FIRST button below it:
#   ios          readout y 0.088..0.103   first button starts 0.123
#   maccatalyst  readout y 0.055..0.066   first button starts 0.084
#   windows      readout y ~0.068         first button starts 0.088
#   android      readout y ~0.073..0.085  first button starts 0.102
# iOS's readout sits BELOW maccatalyst's first button, so no single portable box excludes every lane's
# buttons — and an roi that swallows a button is WORSE than none, since the button reacting would
# satisfy it and pass the very case this exists to catch.
roi_ios = [0.0, 0.080, 0.42, 0.112]
roi_android = [0.0, 0.065, 0.42, 0.095]
roi_maccatalyst = [0.0, 0.048, 0.20, 0.074]
roi_windows = [0.0, 0.055, 0.20, 0.080]
automation_id = "clicked_button"   # used by the DevFlow driver if present; ignored by coordinates
