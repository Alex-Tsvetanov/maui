# Scenario for the `button` page: capture idle, tap the counter button, capture the reacted state.
#
# Coordinates are ABSOLUTE screen pixels, CALIBRATED FOR A 1512-WIDE DISPLAY (1512x950).
# Geometry model (measured on the C++ gallery, Mac Catalyst): the window is 1024 pt wide, horizontally
# centered, pinned to the top (y_origin = 30). So centered controls sit at screen x = display_width/2
# = 756, and control y is measured from the fixed top (resolution-independent). Verified: this taps the
# "Clicked" button, which bumps the "Taps:" readout (0 -> 1).
#
# Re-calibrate if you change the display WIDTH (x = width/2) or the gallery window size. `automation_id`
# is the forward-looking hook: the DevFlow driver taps it by name (resolution-independent, no coords);
# the coordinate driver ignores it and uses `at`.

# THE MAUI COLUMN CANNOT REACT TO THIS TAP. The shared XAML twin (port/maui-reference/pages/button.xaml)
# carries a literal <Label Text="Taps: 0"/> next to "<!-- Clicked (handler omitted) -->", while the
# port's code-first builder DOES wire the handler — measured on windows run 2026-08-07-01_18_39, the
# port's readout goes "Taps: 0" -> "Taps: 1" (57 px) and MAUI's stays at 0 px. Driving this page can
# therefore only ever produce a MOTION MISMATCH, and that mismatch is the twin's omission, not a port
# defect: motion_score reads the flag below and says so instead of reddening the cell.
#
# RETIRE THIS BY FIXING THE TWIN, not by deleting the scenario — the batched twin-gesture-markup change
# adds the Clicked handler on all four platforms, after which all three columns react and the flag comes
# out. Until then the still capture and the port's own reaction are still worth having.
twin_cannot_react = true

tag = "button"
themes = ["light"]        # add "dark" to also sweep dark; frames continue the NNNN sequence
timeout_seconds = 30

[[steps]]
name = "initial"          # no action -> settle + screenshot

[[steps]]
name = "after-tap"
action = "click"
at = [756, 171]           # the "Clicked" button (3rd row) -> bumps the "Taps:" readout
automation_id = "clicked_button"   # used by the DevFlow driver if present; ignored by coordinates
