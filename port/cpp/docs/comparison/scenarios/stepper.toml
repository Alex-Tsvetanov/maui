# Scenario for the `stepper` page: capture at rest, then click the "+" half of the `default_stepper_`
# Stepper, incrementing its native Value.
#
# WHY THIS CONTROL: TRIAGE.md's stepper row — twin stepper.xaml:5-6 ('Default' Stepper); builder
# stepper_page.hpp:169 declares `default_stepper_` with zero connects. AVOID `enable_stepper_` (line 8
# twin, IsEnabled=False trap) and `value_changed_stepper_` (builder line 84: connected to
# update_readout, rewriting 'Value: N' — handler-driven). Clicking `default_stepper_`'s "+" is
# CONTROL-INTRINSIC — no readout Label is bound to it on this page, but the +/- segments are NOT
# visually inert: at rest, Value == Minimum == 0, so the native control disables (and greys out) the
# "-" segment while "+" stays enabled (black) — confirmed in the real capture, see
# port/cpp/docs/comparison/captures/ios/maui/stepper_light.png. One click on "+" bumps Value to 1,
# which re-enables "-" and repaints it from grey to black; THAT enabled/disabled repaint is the durable
# pixel diff this scenario is verifying, identical mechanism on every column. `at` MUST stay on the "+"
# half: a tap on "-" at Value==Minimum is a clamped no-op with no repaint at all.
#
# COORDINATE SPACE — fractions of the captured surface (0..1 on both axes), scaled against the
# presented window rect on desktop, the Simulator screen rect on iOS, `wm size` on Android (full
# rationale in carousel_page.toml). Measured from
# port/cpp/docs/comparison/captures/ios/maui/stepper_light.png (1206x2622): the page is a flat
# VerticalStackLayout ("Default" label + Stepper, "Disabled" label + Stepper, ...) in XAML order; the
# first (default_stepper_) "+" glyph sits at roughly pixel (250, 350) of that frame -> fraction
# (0.21, 0.13).
#
# TO RECALIBRATE: divide the target pixel by that frame's width/height. It is the FIRST Stepper on the
# page (below the "Default" label) — re-locate it in a fresh capture if row order/spacing changes.
# Calibrated from the iOS capture (per house convention — every sibling scenario does the same); the
# desktop lanes (maccatalyst/windows, 1024x800) pack rows tighter, so this y resolves ~1.5x higher in
# their stack, landing in blank space above the control rather than on any other Stepper — a harmless
# miss, not a handler collision.

tag = "stepper"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "initial"

[[steps]]
name = "incremented"
action = "click"
at = [0.21, 0.13]         # default_stepper_ Stepper, the "+" half
# PER-LANE OVERRIDES. The portable `at` above is calibrated on the iOS capture, where the Stepper is
# wide and centred. The desktop lanes render the same control as two ~32px buttons hard against the
# left margin, so 0.21 lands in bare page — measured, not guessed: _selftest.py flagged both lanes as
# FLAT PAGE BACKGROUND before these were added. Keyed by ENVIRONMENT name, because local.toml gives
# Catalyst and AppKit the same `platform`, so platform cannot address them apart.
#   windows      "+" at (67, 90) of 1024x800  -> 0.065, 0.113
#   maccatalyst  "+" at (62, 74) of 1024x800  -> 0.061, 0.0925 (rows sit ~16px higher than Windows; no
#                title bar inside the captured content, unlike the Windows chrome strip)
# Re-derive by opening captures/<lane>/maui/stepper_light.png and dividing the "+" centre by the frame.
#
# THE CATALYST y WAS 10px LOW AND WORKED BY ACCIDENT. 0.105 resolved to y=84, and the stepper pill
# occupies y[63..83] — one pixel BELOW the control, in the gap before the "Disabled" label. Overlaying
# a crosshair on the capture is what showed it; the aim gate did not, because the gap is not flat page
# background. It still registered sometimes (the hit area runs past the visible pill) and sometimes not
# — run 2026-08-07-06_54_58 changed 22 px in all three columns, run 2026-08-07-07_57_41 changed 0 in
# all three. A coordinate that works by accident stops working the next time row spacing shifts, and a
# scenario that silently does nothing is exactly what these files exist to prevent.
at_windows-x64 = [0.065, 0.113]
at_macos-arm64 = [0.061, 0.0925]
# ANDROID: the portable 0.21 resolves to x=227, which on this lane is inside the MINUS plate
# (x[45..265]); the plus plate is x[285..510] with its glyph at x~396. Tapping minus at
# Value == Minimum == 0 is a clamped no-op with NO repaint — exactly what this file's header warns
# about — so the cell scored 0 changed pixels and INVALID/`not-driven`.
#
# It needs a lane key rather than a change to the portable value: iOS resolves the SAME 0.21 onto the
# "+" half and is GREEN there, so editing `at` would trade one lane for the other. `at_android` was
# added to capture_android.input_argv for this (the VM lanes get the equivalent from
# run_comparison.for_lane; neither device lane has an env name to key on).
at_android = [0.367, 0.13]
