# Scenario for the `carousel_page` page: capture Card 1 at rest, then swipe LEFT to page to Card 2.
#
# WHY A SWIPE AND NOT A SCROLL: CarouselView pages HORIZONTALLY. The `scroll` verb only carries `dy`,
# so it can never move this control — which is why this page has sat in ANIMATED producing 12
# byte-identical burst frames and a discarded GIF.
#
# WHY THIS PAGE IS DRIVABLE AT ALL (the rule that killed 11 of its 13 siblings): the shared XAML twins
# in port/maui-reference/pages/ deliberately OMIT every GestureRecognizer and Clicked handler
# ("interaction concerns … omitted at rest"), so the maui_xaml GROUND-TRUTH column cannot react to
# anything an app handler would have driven. Paging a CarouselView is CONTROL-INTRINSIC — the
# ItemsSource and ItemTemplate are declared in the twin and the control pages itself — so all three
# columns react or none do. That is the only shape of interaction this board can score. (Same reason
# entry.toml and scroll_view.toml work: typing into an Entry and scrolling a ScrollView need no
# handler either.)
#
# COORDINATE SPACE — FRACTIONS of the captured surface (0..1 on both axes), which is the portable
# authoring contract every lane now implements: run_comparison.step_point scales against the presented
# window rect, capture_ios against the Simulator screen rect it resolves from the Accessibility
# iOSContentGroup subrole, capture_android against `adb shell wm size`. One number therefore means the
# SAME RELATIVE POINT on a 1024x800 Catalyst window, a 480x752 AppKit window, a 1206x2622 Simulator
# and a 1080x2340 emulator — which is what lets this one file drive all five lanes.
#
# This page was originally authored in absolute screen pixels, and that is worth remembering as the
# argument for fractions rather than a footnote: the macOS window is pinned at [128, 30, 1024, 800]
# and the Windows one at [244, 0, 1024, 800], so a single absolute pair lands 116px right and 30px up
# on macOS relative to Windows — two different relative targets from one number. Fractions also
# removed a live hazard on Android, where the absolute y=120 fell inside the status bar (rows 0..~135)
# and would have pulled the notification shade instead of the page.
#
# A fractional scenario is seeded onto EVERY lane by recapture.seed_scenarios; an absolute one is
# refused on any lane whose window does not contain it, with a named SCENARIO SKIPPED line.
#
# The card fills essentially the whole window on every lane (see
# captures/{maccatalyst,windows}/maui/carousel_page_light.png), so the exact point is forgiving.
#
# TO RECALIBRATE: find the pixel you want in any run frame (0001.png), divide by that image's width
# and height. Do NOT use the "1512-wide display, window centered, x = width/2 = 756" model the older
# scenarios carry: `present` PINS the window to an explicit rect, so the centering never happens.
#
# WHY `to` AND NOT `direction`+`distance`: only `at`/`to` are classified as fractional by
# recapture.coordinate_space — a bare `distance` scalar is still absolute on every lane, so mixing it
# with fractional endpoints would silently span the wrong extent.
#
# UNVERIFIED ON DEVICE: whether a synthetic left-mouse drag pages a CarouselView under Mac Catalyst
# (UICollectionView) or WinUI. It may not — a mouse drag is not a pan on either. That non-reaction is
# SYMMETRIC across all three columns (same control, same markup), so it cannot manufacture a red; it
# would simply leave the GIF as motionless as it is today, which is the finding to report.

tag = "carousel_page"
themes = ["light", "dark"]   # the board sweeps animated pages in both; --themes still overrides
timeout_seconds = 30

[[steps]]
name = "initial"          # no action -> settle + screenshot. MUST stay named "initial": that is the
                          # frame import_run_captures.initial_frame copies to the board still, so the
                          # board PNG is byte-identical to a no-scenario run.

[[steps]]
name = "paged-left"
action = "swipe"
at = [0.85, 0.45]         # right side of the card, vertically mid-surface
to = [0.15, 0.45]         # 70% of the width leftward — well past the half-item paging threshold,
                          # and it stays on-surface at every lane's aspect ratio
steps = 20                # a deliberate PAN, not a flick: paging needs the intermediate move events
duration = 0.5            # 25ms per move — above the ~20ms floor where both OSes coalesce moves
