# Scenario for the `picker` page: capture at rest, then tap the "Basic" Picker to open its native
# picker chrome (wheel/popover/dialog, whichever the platform renders), capturing the OPENED state.
#
# WHY THIS CONTROL: TRIAGE.md's picker row — picker_page.hpp DOES call .connect() 4 times on this page
# (lines 81, 109, 111, 117), but NOT on `basic_picker_` (picker_page.hpp:57-62), which is built with
# items only. Twin picker.xaml:7-30, the FIRST Picker ("Basic", Title="Select an item", 20 x:String
# items, no SelectedIndex), has no code-behind at all — matches. AVOID every other Picker on the page
# (SelectedIndex=1 / SelectedIndexChanged / TextColor / TitleColor / FontAttributes / dynamic-items /
# Items-markup): several of those ARE wired to the connected handlers above.
#
# WHY OPEN-ONLY, NOT "OPEN + SELECT AN ITEM": tapping a Picker is control-intrinsic either way (no app
# handler needed for the platform chrome to appear), but the SECOND tap — landing on a specific row
# inside the resulting wheel/dialog/dropdown — has no fraction that is safe across lanes: iOS/Catalyst
# present a bottom action-sheet wheel, Android an AlertDialog list, desktop lanes a differently-shaped
# popover/flyout, each at a different position and each liable to change frame-to-frame if the picker
# scrolls to a different starting row. Per the task's own geometry-trap guidance ("prefer a control
# whose change is in-place... say in the header if you chose the popover anyway"): this page has no
# in-place alternative (every other Picker instance is handler-driven, see above), so the popover is
# the only available control-intrinsic reaction, and this scenario stops at OPENING it — a large,
# platform-chrome pixel diff every column must render for the same reason, without gambling a second
# tap on a target that moves per lane.
#
# COORDINATE SPACE — fractions of the captured surface (0..1 on both axes), scaled against the
# presented window rect on desktop, the Simulator screen rect on iOS, `wm size` on Android (full
# rationale in carousel_page.toml). Measured from
# port/cpp/docs/comparison/captures/ios/maui/picker_light.png (1206x2622) with a border-row scan (not
# eyeballed): the VerticalStackLayout has Padding=12, and the repeating Label+Picker rows produce
# horizontal border lines at y=291/392 (box 1, "Basic"), 480/581 (box 2), 669/... (box 3). Box 1 spans
# y=291..392 -> vertical center 341.5 -> fraction 0.13; x is the horizontal center of the Padding=12
# box (~603 of 1206) -> fraction 0.5.
#
# TO RECALIBRATE: divide the target pixel by that frame's width/height. If content above "Basic" grows
# (an inserted row), re-run the border-row scan and re-locate box 1, not just shift the y by eye.
#
# CROSS-LANE CHECK — and this file PREDICTED ITS OWN MISS, which the board then measured. The original
# note read: "the same border-row scan against captures/maccatalyst/maui/picker_light.png puts box 1 at
# y=58..84 -> fraction ~0.089, noticeably below this file's 0.13 ... The two boxes' fraction ranges
# don't overlap, so no single fraction hits both lanes' box exactly ... a miss on macOS/Windows would
# land in the gap between two Picker rows (blank space)". That was written when there WAS no way to
# express a per-lane point; `at_<env>` overrides (run_comparison.for_lane) arrived later. There is now,
# so the accepted miss is fixed rather than re-documented.
#
# RE-MEASURED with the same border-row scan, both desktop lanes, full-width box edges:
#
#   maccatalyst  box 1 spans y[59..84]   centre  71 of 800  -> 0.0887   (confirms the note's ~0.089)
#   windows      box 1 spans y[96..127]  centre 111 of 800  -> 0.1388
#
# ONLY MACCATALYST GETS AN OVERRIDE, and the reason matters. The portable 0.13 resolves to y=104, which
# on maccatalyst falls in the GAP between box 1 (ends 84) and box 2 (starts 107) — exactly the blank
# space the note predicted. On WINDOWS y=104 is INSIDE box 1 [96..127]: the aim there is already
# correct, and that lane still scored `not-driven`. So the two lanes' cells share a symptom and not a
# cause, and a windows override would be a coordinate change dressed up as a fix for something else.
# The Windows non-reaction is a separate open question — the tap lands on the Picker and no chrome
# appears — recorded in PARITY_REVIEW.md rather than papered over here.

tag = "picker"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "initial"

[[steps]]
name = "opened"
action = "click"
at = [0.5, 0.13]          # basic_picker_ ("Basic", no SelectedIndex, no handler) — 1st Picker on the page
# maccatalyst packs the rows tighter than iOS, so 0.13 lands in the blank gap BETWEEN box 1 and box 2.
# Measured centre of box 1 on that lane: y=71 of 800. Windows needs none — see the cross-lane note.
at_macos-arm64 = [0.5, 0.0887]
# THE DECLARED REACTION REGION — the first Picker's own box, per lane. This page is why
# ROI_DIFF_THRESHOLD exists: on WINDOWS the click opens the ComboBox and its focus state changes 29,434
# px (the full width of the control) by an amplitude of SIX. The whole-frame floor is 25, so all three
# columns read 0 and the cell scored INVALID/`not-driven` — on a cell where the three agree TO THE PIXEL
# (29434 each, identical box, run 2026-08-09-20_13_27). Inside a region the author declared, "did this
# change" is the question, not "would a human notice".
roi_windows = [0.0, 0.09, 1.0, 0.17]
roi_maccatalyst = [0.0, 0.06, 1.0, 0.12]
roi_ios = [0.0, 0.10, 1.0, 0.16]
roi_android = [0.0, 0.10, 1.0, 0.17]
