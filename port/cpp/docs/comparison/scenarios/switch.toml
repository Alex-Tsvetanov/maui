# Scenario for the `switch` page: capture at rest, then toggle the BackgroundColor switch.
#
# RESTORED after d51acde0e8 dropped it as undrivable, and this one is NOT a coordinate error — the
# coordinate was always right. What was wrong is the gesture, and correcting it exposes a PORT DEFECT.
#
# MEASURED 2026-08-07, iPhone17-265 / iOS 26.5, same point [0.078,0.214] = (31,187)pt, diffed BELOW the
# status bar, both columns, launched fresh per attempt:
#
#             gesture              maui                          cpp
#   instantaneous `idb ui tap`     bbox=None    0 px             bbox=None   0 px
#   `--duration 0.5`               bbox=(0,323,189,407) 12428px  bbox=None   0 px
#   `--duration 1.2`               bbox=(0,323,189,407) 12428px  bbox=None   0 px
#
# LOOKED AT, not just hashed: MAUI's BackgroundColor switch goes blue/off (thumb left) -> green/on
# (thumb right). The port's stays blue/off after the identical 0.6s press at the identical point.
#
# So d51acde0e8's "idb cannot actuate UISwitch" was half right and half wrong, and the half that was
# wrong matters: an INSTANTANEOUS tap actuates neither column — that part is a real tool limitation —
# but a HELD press actuates MAUI and does NOT actuate the port. A control that MAUI toggles and the
# port ignores is a port defect, not a harness limit, and dropping the scenario hid it.
#
# This scenario is therefore EXPECTED to report a MOTION MISMATCH on iOS until the port's Switch
# accepts a held press. That is the honest state: the mismatch IS the bug. Do not "fix" the board by
# deleting this file again.
#
# `duration` is honoured by capture_ios (tap gains --duration); the desktop lanes ignore the key and
# click normally, which is correct — a mouse click toggles a Switch on Windows/macOS.

tag = "switch"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "initial"

[[steps]]
name = "toggled-on"
action = "click"
at = [0.078, 0.214]      # bg_color_switch_ Switch — the blue on-track, measured from the at-rest still
# ANDROID: 0.078,0.214 resolves to (84,500), which on this lane is the blue BACKGROUND of the row,
# not the toggle. Android lays a Switch out with its label (or empty space) filling the row and the
# CONTROL pinned to the RIGHT edge — the BackgroundColor row is a full-width blue band with the
# thumb at x~995 — so a left-hand fraction taken from a lane that centres the control lands on
# paint. Measured thumb centre (995,586) of 1080x2340 -> 0.921, 0.2504.
at_android = [0.921, 0.2504]
duration = 0.6           # HELD: an instantaneous tap actuates neither column (see the table above)

# CATALYST NEEDS ITS OWN AIM. The `at` above is a fraction of a 402x874 PORTRAIT PHONE, and the same
# fraction of Catalyst's 1024x800 LANDSCAPE window is a different place on the page: it resolves to
# (80,171), which is empty space to the right of the "Background" row. MEASURED 2026-08-07 on the
# maccatalyst captures — the blue BackgroundColor track is x[0..47] y[117..137], identically in
# maui, cpp AND xaml (533 blue px, same bbox in all three), so its centre is (23,127) = this
# fraction of the 1024x800 rect. That miss is why the 2026-08-07 run scored switch NOTHING MOVED at
# 0.0000% in every column.
#
# AUTHOR IT AS A FRACTION, NEVER AS PIXELS. coordinate_space() classifies over _points(), which
# INCLUDES at_<env> keys — one absolute pair anywhere in the file flips the whole scenario to
# "absolute", and device_scenarios then drops it from the iOS lane BY NAME. Writing [23,127] here
# would silently delete the iOS held-press finding this file documents above.
at_macos-arm64 = [0.023, 0.159]
