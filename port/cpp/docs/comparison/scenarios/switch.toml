# Scenario for the `switch` page: capture at rest, then click the `bg_color_switch_` Switch (its
# BackgroundColor="Blue" off-track) so it toggles on, sliding the thumb and swapping the track to the
# platform's on-tint color.
#
# WHY THIS CONTROL: TRIAGE.md's switch row — twin switch.xaml:8-9 ('BackgroundColor' Switch, no
# bindings); builder switch_page.hpp:96 declares `bg_color_switch_` with zero connects. AVOID
# `default_switch_` (builder line 36: toggled -> rewrites `readout_` between 'Default switch is
# On/Off', twin's static label) and `disabled_switch_` (twin line 13, IsEnabled=False trap — can't
# toggle). Toggling `bg_color_switch_` is CONTROL-INTRINSIC: the Switch repaints its own thumb/track,
# same mechanism on every column.
#
# COORDINATE SPACE — fractions of the captured surface (0..1 on both axes), scaled against the
# presented window rect on desktop, the Simulator screen rect on iOS, `wm size` on Android (full
# rationale in carousel_page.toml). Measured from
# port/cpp/docs/comparison/captures/ios/maui/switch_light.png (1206x2622): the page is a flat
# VerticalStackLayout ("Default" label + Switch, "Default switch is Off" label, "BackgroundColor" label
# + Switch, ...) in XAML order; the 2nd Switch (bg_color_switch_, blue track) sits at roughly pixel
# (95, 605) of that frame -> fraction (0.08, 0.23).
#
# TO RECALIBRATE: divide the target pixel by that frame's width/height. It is the SECOND Switch on the
# page (below the "BackgroundColor" label, 1st is default_switch_ — AVOID) — re-locate it in a fresh
# capture if row order/spacing changes.
# Calibrated from the iOS capture (per house convention — every sibling scenario does the same); the
# desktop lanes (maccatalyst/windows, 1024x800) pack rows tighter, so this y resolves ~1.5x higher in
# their stack — checked against the real maccatalyst capture, the drift lands in blank space beside the
# "Background"/"Disabled" switches, not on any handler-driven control.

tag = "switch"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "initial"

[[steps]]
name = "toggled-on"
action = "click"
at = [0.08, 0.23]         # bg_color_switch_ Switch, blue off-track below "BackgroundColor" label
