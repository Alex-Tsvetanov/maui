# Scenario for the `scroll_view` page: capture top, scroll down, capture the scrolled state.
#
# Coordinates are ABSOLUTE screen pixels, CALIBRATED FOR A 1280-WIDE DISPLAY (e.g. 1280x800). Window is
# 1024 pt wide, centered, pinned to the top -> centered content at screen x = width/2 = 640. Scroll is
# forgiving: any point over the list works. `dy` is pixels; negative scrolls the content up (reveals
# lower rows). Verified: scrolls the 40-row list from Row 0 down to ~Row 25-30, updating "Scrolled to:".

tag = "scroll_view"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "top"

[[steps]]
name = "scrolled-down"
action = "scroll"
at = [640, 400]           # over the list body (centered, mid-window)
dy = -400
