# Scenario for the `scroll_view` page: capture the at-rest state, scroll down, capture the scrolled one.
#
# FRACTIONS OF THE TARGET SURFACE (0..1), scaled per lane. The previous version was ABSOLUTE pixels
# calibrated for a 1512x950 Mac display, and the consequence was not a mis-aimed gesture — it was NO
# GESTURE AT ALL. recapture.device_scenarios() classifies a file carrying any absolute pair as
# un-replayable on a device lane and skips the WHOLE scenario, which the runner logged as
#   !! SCENARIO SKIPPED android (...)/scroll_view: absolute desktop coordinates cannot be replayed on a
#      device with different geometry; re-author as 0..1 fractions
# so on iOS and Android this page was never driven at all: both columns sat still, agreed perfectly, and
# the board scored it "NOTHING MOVED" — no motion parity measured whatsoever.
#
# The first step MUST stay named `initial`. It was named `top`, and that name is not cosmetic:
# recapture.py picks the published at-rest frame by looking for the step called `initial`, and decides a
# page is DRIVEN with `any(step != "initial" and not step.startswith("gif"))` — so a first step named
# anything else both loses the at-rest anchor and counts itself as a drive.
#
# THE TWO AXES OF THIS FILE OBEY DIFFERENT RULES, and they are not negotiable — one comes from the
# device lanes, the other from the VM lanes, and a value that satisfies only one is silently or loudly
# fatal on the other:
#   `at`  MUST be FRACTIONAL. recapture.device_scenarios() skips the entire file on iOS/Android if any
#         coordinate pair is absolute (that is the bug this file was re-authored to fix).
#   `dy`  MUST be a NON-ZERO INTEGER. run_comparison.py:546 tests `isinstance(dy, int)` and RAISES on a
#         float — and that raise aborts the WHOLE capture stage, not just this page. Measured the hard
#         way: dy = -0.35 killed the maccatalyst stage at unit 70 of 186.
# `dy` is not part of a coordinate PAIR, so it does not affect device_scenarios' fraction/absolute
# classification — an integer dy therefore keeps the device lanes happy while satisfying the VM's type
# check. It is read as pixels on Android (400 of 2340) and as POINTS on iOS (400 of 874), so the same
# number is a different fraction per lane; that is acceptable because a scroll only has to WITNESS
# motion, and it is verified below rather than assumed.
#
# Recalibrating: open captures/<platform>/maui/scroll_view_light.png, find a row well inside the list,
# express its centre as a fraction of the frame, then check that same fraction against the cpp and xaml
# captures. All three columns must receive the identical gesture or the comparison means nothing.

tag = "scroll_view"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "initial"

[[steps]]
name = "scrolled-down"
action = "scroll"
at = [0.5, 0.7]           # over the list body, inside the rows on every lane
dy = -400                 # integer REQUIRED (see above): 400 px on Android, 400 pt on iOS/VM
# SETTLE: an inertial/animated surface is STILL MOVING when the default STEP_SETTLE (0.6s)
# fires, so the shot measures WHERE THE FLING HAD GOT TO, not parity. Measured on box_view/ios
# (4 launches per column, same injected gesture): at 0.6s MAUI's OWN landings spread 52px
# (1694/1658/1684/1642); at 2.0s all 8 launches across both apps land at 1690px and rows
# 200..1216 are byte-identical. Not a scorer change -- it photographs the at-rest state the
# page actually reaches, which is what every undriven page on the board is already compared at.
settle = 2.0

