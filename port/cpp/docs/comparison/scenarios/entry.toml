# Scenario for the `entry` page: focus the first field, type text, capture the typed state.
#
# Coordinates are ABSOLUTE screen pixels, CALIBRATED FOR A 1512-WIDE DISPLAY (1512x950). Window is
# 1024 pt wide, centered, pinned to the top (y_origin = 30) -> centered controls at screen x = width/2 =
# 756; y measured from the fixed top. Verified: this focuses the first Entry ("Type here…") and types
# into it. Re-calibrate if you change the display width or the gallery window size.

tag = "entry"
themes = ["light"]
timeout_seconds = 30

[[steps]]
name = "initial"

[[steps]]
name = "focus-field"
action = "click"
at = [756, 111]           # the first Entry ("Type here…")

[[steps]]
name = "typed"
action = "type"
text = "MAUI"
