# Lanes whose CAPTURES cannot be trusted for a reason no pixel and no hash can detect.
#
# Every provenance check in this pipeline binds a capture to its own run: motion_score._is_published_run
# ties a run's frames to the still on the board byte-for-byte, and pixel_score.stills_fingerprint ties a
# recorded verdict to the stills it was taken on. Both are sound and neither can see the failure this file
# is for — A BUILD HOST RENDERING SOURCE THAT IS NOT THIS TREE. Old code renders perfectly, is captured
# perfectly, and hashes perfectly. Nothing downstream can tell.
#
# Read by pixel_score.declare_lane. Syntax:
#
#   [<board platform>]
#   motion_invalid = true     every motion verdict on this lane becomes INVALID, whatever the frames say
#   reason = "..."            appended to the review text of every affected cell
#
# NO LANE IS CURRENTLY DECLARED. That is a measurement, recorded below so nobody re-arms one from memory.

# ---------------------------------------------------------------------------------------------------
# WINDOWS — declared stale in 0e47d1d0fb, RETRACTED here. The declaration was WRONG and cost 34 green
# cells. It is written up rather than quietly deleted because the mistake is a repeat of a named failure
# mode, and the next person to reach for this file will be tempted by the same reasoning.
#
# WHAT I DID: armed `[windows] motion_invalid = true` citing "SYNC_STAMP.txt last measured SIX DAYS
# behind". That figure came from a note, not from the guest. The guest was unreachable at the time
# (ssh: publickey/password denied), and I armed the declaration anyway on the grounds that a stale tree
# "cannot have got fresher on its own". It had. The SSH failure was my own error — the guest user is
# `Testings-VM` (config/windows.toml:46), not the host login I probed with.
#
# WHAT IS ACTUALLY TRUE, verified over SSH to Testings-VM@192.168.65.2 on 2026-08-08:
#
#   C:/maui-src/SYNC_STAMP.txt  ->  6814b588b9  hostsync-20260807
#
#   * 6814b588b9 IS the resync. Its own subject is "windows: the crash was a STALE GUEST TREE" — the
#     commit that FOUND the staleness and fixed it, 2026-08-07 00:57:51.
#   * The board's Windows captures come from run 2026-08-07-01_18_39 at commit 3f70bd6e91 — twenty-one
#     minutes LATER, and that commit's subject is "windows/gestures: GREEN in both columns AFTER THE
#     RESYNC". The captures were taken from the resynced guest.
#   * Of the 26 commits between the guest's tree and HEAD, exactly three touch buildable source:
#     CMakeLists.txt, android/gesture_platform_manager.cpp, ios/switch_handler.mm. The first is a
#     `target_link_libraries(maui_core PUBLIC log)` INSIDE the android branch; the other two are Android
#     and iOS backends. NOTHING in the Windows column's build is behind.
#
# THE LESSON, which is not "the note was out of date" — it is that a note is not a measurement, and the
# right response to "I cannot verify this right now" is to leave the gate OFF and say so, not to arm it
# and annotate the uncertainty. An unverified declaration is indistinguishable, downstream, from a
# verified one: it invalidated 86 cells and capped 34 greens with the full authority of the mechanism.
# Re-verify SYNC_STAMP.txt against `git log -1 <stamp-commit>` before ever arming this again.
