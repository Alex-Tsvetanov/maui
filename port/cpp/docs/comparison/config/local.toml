# E2E visual-comparison runner — example config (copy to local.toml and edit).
# Starter has ONLY the macOS VM: it is the only environment with a real desktop GUI to run today
# (the port has no Windows/Linux backend yet). See tools/README_e2e.md for the VM setup.

version = 1

[output]
root = "port/cpp/docs/comparison"        # a dated <root>/<YYYY-MM-DD-HH_MM_SS>/ subdir is created per run
timestamp_format = "%Y-%m-%d-%H_%M_%S"

# --- environments -----------------------------------------------------------------------------------
[environments.macos-arm64]
os = "macos"                             # picks the vm_agent_macos.py guest agent
platform = "maccatalyst"                 # path segment: …/<tag>/<platform>/<column>/NNNN.png

[environments.macos-arm64.connection]
host = "Testings-Virtual-Machine.local"  # NOTE: retype by hand — a stray zero-width char after ".local"
user = "testinguser"                     # will silently break DNS. ssh key already installed (ssh-copy-id).
connect_timeout_seconds = 10

[environments.macos-arm64.display]       # requirement 4: set the VM display resolution explicitly
# displayplacer CAN switch the guest between modes UTM currently offers (verified: 3840x2160 ->
# 1280x804 -> 1512x950 all took). What it CANNOT do is conjure a mode that is not on offer, and UTM
# regenerates the mode list from its HOST WINDOW SIZE — so after the UTM window is resized, a value
# pinned here may no longer exist, set-resolution fails, and the run (correctly) aborts.
#
# MUST BE A 1x MODE. UTM lists most sizes twice, plain and `scaling:on` (HiDPI); the HiDPI twin
# captures at 2x, so a 1024x800 present comes back as a 2048x1600 PNG and the +/-4px size guard drops
# every frame. 1512x950 is UTM's unscaled twin of the 1512x949 HiDPI mode a 14" host window produces
# — same window, 1px taller, 1x. cmd_set_resolution now filters to unscaled modes and rejects a HiDPI
# landing, so a mistake here fails loudly at preflight instead of after two hours of dropped frames.
#
# The exact size barely matters for capture: `present` pins each window to an explicit 1024x800 rect
# and captures THAT, so the display only has to be large enough to contain it (800 + the y=30 origin
# fits in 950). The scenario tap calibration is likewise unaffected — the board runs with an empty
# scenarios dir, so no coordinate taps ever fire.
width = 1512
height = 950

# No external window-pinning: Mac Catalyst windows can't be repositioned externally (AX reports
# position/size as unsettable — kAXErrorAttributeUnsupported; System Events hits the same layer). Instead
# the window CENTERS deterministically for the display size (x_origin = (width-1024)/2, y=30 fixed), so
# fixing the resolution above fixes the geometry — centered controls sit at screen x = width/2, which is
# 756 at the 1512 pinned above (it was 640 when this guest ran at 1280 wide; any seed scenario carrying
# hard-coded x coordinates is calibrated to a width and must be re-checked when this changes — the board
# itself is unaffected, it runs with an empty scenarios dir). For geometry-independent taps, use the DevFlow
# `automation_id` path (tap by name, no coordinates). See tools/README_e2e.md.

[environments.macos-arm64.staging]
root = "/Users/testinguser/maui-comparison"   # remote staging; its scratch/ is cleaned each run

# Absolute tool paths — a non-interactive SSH shell has a minimal PATH (no /opt/homebrew/bin),
# so bare `cliclick`/`displayplacer` would fail. Everything is invoked by full path.
[environments.macos-arm64.tools]
python3       = "/usr/bin/python3"
cliclick      = "/opt/homebrew/bin/cliclick"
displayplacer = "/opt/homebrew/bin/displayplacer"
screencapture = "/usr/sbin/screencapture"
open          = "/usr/bin/open"

# Per-column deployable + launch contract. Artifacts are paths relative to the repo root, pre-built on
# the host (Catalyst gallery build + `dotnet build`); the runner deploys them, it does not build.
#   maui_xaml → the C# MauiReference.app;  cpp/cpp_xaml → gallery / gallery_xaml Catalyst .app bundles.
[environments.macos-arm64.columns.maui_xaml]
artifact  = "port/maui-reference/app/bin/Debug/net10.0-maccatalyst/maccatalyst-arm64/MauiReference.app"
artifact_release = "port/maui-reference/app/bin/Release/net10.0-maccatalyst/maccatalyst-arm64/MauiReference.app"
process   = "MauiReference"
page_env  = "MAUI_COMPARE_PAGE"
theme_env = "MAUI_THEME"
theme_light = "Light"
theme_dark  = "Dark"
driver = "maui_devflow"     # MAUI DevFlow CLI tap-by-automationId; else coordinates (see README)
devflow_cli = "maui"        # path to the `maui` global tool on the VM (needs it installed there)

[environments.macos-arm64.columns.cpp]
artifact  = "port/cpp/examples/build-maccatalyst/gallery/gallery.app"
artifact_release = "port/cpp/examples/build-maccatalyst-release/gallery/gallery.app"
process   = "gallery"
page_env  = "MAUI_SAMPLE_PAGE"
theme_env = "MAUI_APPEARANCE"
theme_light = "light"
theme_dark  = "dark"
# The C++ DevFlow agent has landed (port/cpp/src/devflow). To use tap-by-automationId, rebuild the
# gallery with -DMAUI_DEVFLOW=ON, then set: driver = "cpp_devflow" and devflow_port = 8765
driver = "coordinate"

[environments.macos-arm64.columns.cpp_xaml]
artifact  = "port/cpp/examples/build-maccatalyst/gallery_xaml/gallery_xaml.app"
artifact_release = "port/cpp/examples/build-maccatalyst-release/gallery_xaml/gallery_xaml.app"
process   = "gallery_xaml"
page_env  = "MAUI_SAMPLE_PAGE"
theme_env = "MAUI_APPEARANCE"
theme_light = "light"
theme_dark  = "dark"
driver = "coordinate"       # → "cpp_devflow" (+ devflow_port) after rebuilding with -DMAUI_DEVFLOW=ON

[environments.macos-arm64.capture]
reboot_before_run = true
# Drive the VM's OWN appearance rather than handing each column MAUI_APPEARANCE / MAUI_THEME. Those map to
# UserAppTheme on both sides and OVERRIDE the OS, so a run that sets them can only ever prove the override
# works — never that either framework follows the system theme. See OS_THEME_PARITY_STATUS.md.
system_theme = true

# --- AppKit (native NSView) columns -------------------------------------------------------------------
# The SAME VM, a separate environment, because AppKit needs a capture contract Catalyst does not: no
# `present`, and a 480x752 frame instead of 1024x800. Run it with `--env macos-appkit`; NEVER concurrently
# with macos-arm64 — the two share one desktop and one <staging>/scratch/shot.png.
#
# WHY present = false (measured on this VM, not assumed):
#   System Events reports ZERO windows for the apple-backend gallery — before and after `set frontmost`.
#   The same binary on the host Mac reports 1. `present` works by driving `set position/size of window 1`
#   through System Events, so on this VM it fails every retry, self-heals, and DROPS every frame. Quartz
#   sees the window perfectly (1 layer-0 window, 480x752 at x=516), which is exactly what the present=false
#   path uses: window-id -> shot --window <id>. Captured that way the frame is also strictly CLEANER than
#   the old host-side `screencapture -R` crop — no window shadow, no desktop bleed at the rounded corners.
# Capturing BY WINDOW ID also means the window's position stops mattering, so nothing here has to fight
# host_run.mm's hard-coded 480x720 content size.
[environments.macos-appkit]
os = "macos"
platform = "maccatalyst"                 # same board platform -> captures/maccatalyst/appkit_{cpp,xaml}/

[environments.macos-appkit.connection]
host = "Testings-Virtual-Machine.local"
user = "testinguser"
connect_timeout_seconds = 10

[environments.macos-appkit.display]
# Same 1x rule as macos-arm64 above — see that block for why HiDPI modes are disqualified. This lane
# is MORE exposed to it, not less: it captures by window id rather than by rect, and its windows are
# 480x752, so a HiDPI guest yields 960x1504 — which is exactly the frame size the incident recorded
# at run_comparison.py:501 produced, every one of them dropped.
width = 1512
height = 950

[environments.macos-appkit.staging]
root = "/Users/testinguser/maui-comparison"

[environments.macos-appkit.tools]
python3       = "/usr/bin/python3"
cliclick      = "/opt/homebrew/bin/cliclick"
displayplacer = "/opt/homebrew/bin/displayplacer"
screencapture = "/usr/sbin/screencapture"
open          = "/usr/bin/open"

# The artifacts are CMake target DIRECTORIES, not .app bundles — the apple preset emits plain executables
# with their assets alongside. vm_agent_macos.cmd_launch branches on the missing `.app` suffix and execs
# the binary directly with cwd set (assets resolve against CWD); Env.deploy excludes the CMake scratch.
[environments.macos-appkit.columns.appkit_cpp]
artifact  = "port/cpp/examples/build-apple/gallery"
artifact_release = "port/cpp/examples/build-apple-release/gallery"
process   = "gallery"
page_env  = "MAUI_SAMPLE_PAGE"
theme_env = "MAUI_APPEARANCE"
theme_light = "light"
theme_dark  = "dark"
driver = "coordinate"

[environments.macos-appkit.columns.appkit_xaml]
artifact  = "port/cpp/examples/build-apple/gallery_xaml"
artifact_release = "port/cpp/examples/build-apple-release/gallery_xaml"
process   = "gallery_xaml"
page_env  = "MAUI_SAMPLE_PAGE"
theme_env = "MAUI_APPEARANCE"
theme_light = "light"
theme_dark  = "dark"
driver = "coordinate"

[environments.macos-appkit.capture]
reboot_before_run = false
present  = false
# LOAD-BEARING even with present = false: the +/-4px drop guard compares every pulled PNG against this
# geometry unconditionally, so leaving it at the 1024x800 default would delete all 4 frames of a smoke run
# and every frame of a full one. x/y are unused on this path (capture is by window id).
geometry = { x = 0, y = 0, w = 480, h = 752 }
system_theme = true   # drive the GUEST's theme, not a per-column env override
